<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bullish Hammer Carousel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #131722;
      --card-bg: #1e222d;
      --border: #2a2e39;
      --text: #eaecef;
      --text-muted: #848e9c;
      --green: #0ecb81;
      --red: #f6465d;
      --gold: #f0b90b;
      --stock-badge: #3b82f6;
      --crypto-badge: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation & Info Header */
    .top-bar {
      height: 54px;
      background: #181a20;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 10;
      position: relative;
    }
    .sym-details {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sym-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-stock { background: rgba(59, 130, 246, 0.2); color: var(--stock-badge); border: 1px solid var(--stock-badge); }
    .badge-crypto { background: rgba(168, 85, 247, 0.2); color: var(--crypto-badge); border: 1px solid var(--crypto-badge); }
    .badge-green { background: rgba(14, 203, 129, 0.15); color: var(--green); }
    .badge-red { background: rgba(246, 70, 93, 0.15); color: var(--red); }
    
    .counter {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      background: #2b313a;
      padding: 4px 8px;
      border-radius: 12px;
    }

    /* Main Chart Viewport */
    .carousel-container {
      width: 100%;
      height: calc(100% - 110px);
      position: relative;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
    }
    .slide iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }
    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 56px;
      background: #181a20;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      position: relative;
    }
    .nav-btn {
      background: #2b313a;
      border: 1px solid #3c4452;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .nav-btn:active {
      background: #3c4452;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .binance-link {
      font-size: 11px;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="top-bar">
    <div class="sym-details">
      <span class="sym-name" id="symName">LOADING...</span>
      <span class="badge" id="symBadge">FUTURES</span>
      <span class="badge" id="hammerBadge">HAMMER</span>
    </div>
    <div class="counter" id="slideCounter">1 / 10</div>
  </div>

  <!-- Carousel Area (Touch Swipe Enabled) -->
  <div class="carousel-container" id="carouselContainer"></div>

  <!-- Bottom Nav Controls -->
  <div class="bottom-bar">
    <button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀ Prev</button>
    <a href="#" target="_blank" class="binance-link" id="binanceLink">Open on Binance ↗</a>
    <button class="nav-btn" id="nextBtn" onclick="nextSlide()">Next ▶</button>
  </div>

  <script>
    // Expand Telegram WebApp to full height
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Default 10 pairs (Stocks + Cryptos) or load from URL query '?symbols=DKNGUSDT,BXUSDT,...'
    const DEFAULT_COINS = [
      { s: "DKNGUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "BXUSDT", type: "Stock", tag: "🔴 Red" },
      { s: "ARMUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "MUUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "TZAUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "ETHFIUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "ENAUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "ARCUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "NEARUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "GALAUSDT", type: "Crypto", tag: "🟢 Green" }
    ];

    let coins = [];
    const urlParams = new URLSearchParams(window.location.search);
    const symParam = urlParams.get('symbols');
    if (symParam) {
      const stockSet = new Set(["DKNGUSDT", "BXUSDT", "ARMUSDT", "MUUSDT", "TZAUSDT", "AMATUSDT", "MRVLUSDT", "AMCUSDT", "COHRUSDT", "CSOPSAMSUNG2LUSDT"]);
      coins = symParam.split(',').map(s => {
        const clean = s.trim().toUpperCase();
        return {
          s: clean,
          type: stockSet.has(clean) ? "Stock" : "Crypto",
          tag: "Bullish Hammer"
        };
      });
    } else {
      coins = DEFAULT_COINS;
    }

    const BUFFER_SIZE = 5; // Exactly 5 previous + 1 active + 5 next
    let currentIndex = 0;
    const container = document.getElementById('carouselContainer');
    const slideElements = new Map(); // index -> DOM slide element

    function getChartUrl(sym) {
      return `https://s.tradingview.com/widgetembed/?symbol=BINANCE%3A${sym}.P&interval=D&theme=dark&style=1&timezone=Etc%2FUTC&hide_top_toolbar=1&hide_side_toolbar=1&allow_symbol_change=0&save_image=0`;
    }

    function updateSlidePositions() {
      slideElements.forEach((el, idx) => {
        const offset = idx - currentIndex;
        el.style.transform = `translateX(${offset * 100}%)`;
      });
    }

    // Maintains the 11-chart pre-rendered buffer (5 prev, current, 5 next)
    function syncBuffer() {
      const minIdx = Math.max(0, currentIndex - BUFFER_SIZE);
      const maxIdx = Math.min(coins.length - 1, currentIndex + BUFFER_SIZE);

      // Remove slides outside the [minIdx, maxIdx] window
      for (const [idx, el] of slideElements.entries()) {
        if (idx < minIdx || idx > maxIdx) {
          container.removeChild(el);
          slideElements.delete(idx);
        }
      }

      // Pre-render slides within the [minIdx, maxIdx] window
      for (let i = minIdx; i <= maxIdx; i++) {
        if (!slideElements.has(i)) {
          const slide = document.createElement('div');
          slide.className = 'slide';
          const iframe = document.createElement('iframe');
          iframe.src = getChartUrl(coins[i].s);
          iframe.loading = "lazy";
          slide.appendChild(iframe);
          container.appendChild(slide);
          slideElements.set(i, slide);
        }
      }

      updateSlidePositions();
      updateTopBottomUI();
    }

    function updateTopBottomUI() {
      const c = coins[currentIndex];
      document.getElementById('symName').textContent = c.s;
      
      const badge = document.getElementById('symBadge');
      badge.textContent = `${c.type} Futures`;
      badge.className = `badge ${c.type === 'Stock' ? 'badge-stock' : 'badge-crypto'}`;

      const hBadge = document.getElementById('hammerBadge');
      hBadge.textContent = c.tag || "Hammer";
      hBadge.className = `badge ${(c.tag && c.tag.includes('Red')) ? 'badge-red' : 'badge-green'}`;

      document.getElementById('slideCounter').textContent = `${currentIndex + 1} / ${coins.length}`;
      document.getElementById('binanceLink').href = `https://www.binance.com/en/futures/${c.s}`;

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === coins.length - 1;
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        syncBuffer();
      }
    }

    function nextSlide() {
      if (currentIndex < coins.length - 1) {
        currentIndex++;
        syncBuffer();
      }
    }

    // Touch Swipe Gesture Detection
    let touchStartX = 0;
    let touchEndX = 0;

    container.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    container.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) {
          nextSlide(); // swipe left -> next
        } else {
          prevSlide(); // swipe right -> prev
        }
      }
    }

    // Keyboard Arrow navigation for desktop
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
    });

    // Initialize
    syncBuffer();
  </script>
</body>
</html>
