<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bullish Hammer Carousel</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #131722;
      --card-bg: #1e222d;
      --border: #2a2e39;
      --text: #eaecef;
      --text-muted: #848e9c;
      --green: #0ecb81;
      --red: #f6465d;
      --gold: #f0b90b;
      --stock-badge: #3b82f6;
      --crypto-badge: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Status & Info Bar */
    .top-bar {
      height: 52px;
      background: #181a20;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 20;
      position: relative;
    }
    .sym-details {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .sym-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-stock { background: rgba(59, 130, 246, 0.2); color: var(--stock-badge); border: 1px solid var(--stock-badge); }
    .badge-crypto { background: rgba(168, 85, 247, 0.2); color: var(--crypto-badge); border: 1px solid var(--crypto-badge); }
    .badge-green { background: rgba(14, 203, 129, 0.15); color: var(--green); }
    .badge-red { background: rgba(246, 70, 93, 0.15); color: var(--red); }
    
    .counter {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      background: #2b313a;
      padding: 4px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    /* Main Chart Viewport */
    .carousel-container {
      width: 100%;
      height: calc(100% - 108px);
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: transform 0.26s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
    }
    .slide iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg);
    }

    /* Transparent Touch Overlay for Swiping across iframes */
    .touch-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
      cursor: grab;
      touch-action: pan-y;
      display: block;
    }
    .touch-overlay.hidden {
      pointer-events: none;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 56px;
      background: #181a20;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 20;
      position: relative;
    }
    .nav-btn {
      background: #2b313a;
      border: 1px solid #3c4452;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .nav-btn:active {
      background: #3c4452;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .center-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .mode-toggle {
      background: #1e222d;
      border: 1px solid #2f3542;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mode-toggle.active {
      color: var(--gold);
      border-color: rgba(240, 185, 11, 0.4);
    }
    .binance-link {
      font-size: 11px;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="top-bar" id="topBar">
    <div class="sym-details">
      <span class="sym-name" id="symName">LOADING...</span>
      <span class="badge" id="symBadge">FUTURES</span>
      <span class="badge" id="hammerBadge">HAMMER</span>
    </div>
    <div class="counter" id="slideCounter">1 / ...</div>
  </div>

  <!-- Carousel Area -->
  <div class="carousel-container" id="carouselContainer">
    <!-- Touch overlay captures horizontal swipes smoothly over iframes -->
    <div class="touch-overlay" id="touchOverlay"></div>
  </div>

  <!-- Bottom Nav Controls -->
  <div class="bottom-bar" id="bottomBar">
    <button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀ Prev</button>
    <div class="center-actions">
      <button class="mode-toggle active" id="modeBtn" onclick="toggleMode()">✋ Swipe Mode</button>
      <a href="#" target="_blank" class="binance-link" id="binanceLink">Binance ↗</a>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="nextSlide()">Next ▶</button>
  </div>

  <script>
    // Expand Telegram WebApp to full height
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const DEFAULT_COINS = [
      { s: "DKNGUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "BXUSDT", type: "Stock", tag: "🔴 Red" },
      { s: "ARMUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "MUUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "TZAUSDT", type: "Stock", tag: "🟢 Green" },
      { s: "ETHFIUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "ENAUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "ARCUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "NEARUSDT", type: "Crypto", tag: "🟢 Green" },
      { s: "GALAUSDT", type: "Crypto", tag: "🟢 Green" }
    ];

    let coins = [];
    const urlParams = new URLSearchParams(window.location.search);
    const symParam = urlParams.get('symbols');

    async function initCoins() {
      if (symParam) {
        const stockSet = new Set(["AAOIUSDT","ALABUSDT","AMATUSDT","AMCUSDT","ANETUSDT","APLDUSDT","ARMUSDT","AXTIUSDT","BXUSDT","BYDUSDT","BZUSDT","COHRUSDT","CRDOUSDT","CSOPSAMSUNG2LUSDT","CXMTUSDT","DKNGUSDT","FLNCUSDT","GLBEUSDT","HIMSUSDT","HOODUSDT","MRVLUSDT","MUUSDT","PLTRUSDT","RBLXUSDT","RDDTUSDT","RIVNUSDT","SMCIUSDT","SOFIUSDT","SYMUSDT","TZAUSDT","UUSDT"]);
        coins = symParam.split(',')
          .map(s => s.trim().toUpperCase())
          .filter(s => /^[\x00-\x7F]+$/.test(s))
          .map(clean => ({
            s: clean,
            type: stockSet.has(clean) ? "Stock" : "Crypto",
            tag: "Bullish Hammer"
          }));
        syncBuffer();
      } else {
        // Priority 1: Direct GitHub API for instant real-time commit data (0s build delay, no CDN cache)
        try {
          const res = await fetch('https://api.github.com/repos/DDA1O1/hammer-carousel/contents/coins.json', {
            headers: { 'Accept': 'application/vnd.github.v3.raw' },
            cache: 'no-store'
          });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              coins = data.filter(c => c && c.s && /^[\x00-\x7F]+$/.test(c.s));
              syncBuffer();
              return;
            }
          }
        } catch (e) {
          console.warn('Direct GitHub API fetch failed, falling back to local coins.json', e);
        }

        // Priority 2: Local GitHub Pages coins.json with cache buster
        try {
          const res = await fetch('coins.json?v=' + Date.now(), { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              coins = data.filter(c => c && c.s && /^[\x00-\x7F]+$/.test(c.s));
              syncBuffer();
              return;
            }
          }
        } catch (e) {
          console.warn('Local coins.json fetch failed, falling back to default', e);
        }

        coins = DEFAULT_COINS;
        syncBuffer();
      }
    }

    // Memory Buffer: Strictly 5 previous + 1 active + 5 next (11 total pre-rendered)
    const BUFFER_SIZE = 5;
    let currentIndex = 0;
    const container = document.getElementById('carouselContainer');
    const slideElements = new Map(); // index -> DOM slide element

    function getChartUrl(sym) {
      return `https://s.tradingview.com/widgetembed/?symbol=BINANCE%3A${sym}.P&interval=D&theme=dark&style=1&timezone=Etc%2FUTC&hide_top_toolbar=1&hide_side_toolbar=1&allow_symbol_change=0&save_image=0`;
    }

    function updateSlidePositions() {
      slideElements.forEach((el, idx) => {
        const offset = idx - currentIndex;
        el.style.transform = `translateX(${offset * 100}%)`;
      });
    }

    function syncBuffer() {
      if (!coins || coins.length === 0) return;
      const minIdx = Math.max(0, currentIndex - BUFFER_SIZE);
      const maxIdx = Math.min(coins.length - 1, currentIndex + BUFFER_SIZE);

      // 1. Evict distant slides outside the 11-chart buffer window
      for (const [idx, el] of slideElements.entries()) {
        if (idx < minIdx || idx > maxIdx) {
          container.removeChild(el);
          slideElements.delete(idx);
        }
      }

      // 2. Pre-render slides within buffer window
      for (let i = minIdx; i <= maxIdx; i++) {
        if (!slideElements.has(i)) {
          const slide = document.createElement('div');
          slide.className = 'slide';
          slide.style.transform = `translateX(${(i - currentIndex) * 100}%)`;
          const iframe = document.createElement('iframe');
          iframe.src = getChartUrl(coins[i].s);
          iframe.loading = "lazy";
          slide.appendChild(iframe);
          container.appendChild(slide);
          slideElements.set(i, slide);
        }
      }

      updateSlidePositions();
      updateTopBottomUI();
    }

    function updateTopBottomUI() {
      if (!coins || coins.length === 0) return;
      const c = coins[currentIndex];
      const priceText = c.price ? ` $${c.price}` : '';
      const wickText = c.wick ? ` • Wick: ${c.wick}%` : '';
      document.getElementById('symName').textContent = `${c.s}${priceText}`;
      
      const badge = document.getElementById('symBadge');
      badge.textContent = `${c.type} Futures`;
      badge.className = `badge ${c.type === 'Stock' ? 'badge-stock' : 'badge-crypto'}`;

      const hBadge = document.getElementById('hammerBadge');
      hBadge.textContent = `${c.tag || "Hammer"}${wickText}`;
      hBadge.className = `badge ${(c.tag && c.tag.includes('Red')) ? 'badge-red' : 'badge-green'}`;

      document.getElementById('slideCounter').textContent = `${currentIndex + 1} / ${coins.length}`;
      document.getElementById('binanceLink').href = `https://www.binance.com/en/futures/${c.s}`;

      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === coins.length - 1;
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        syncBuffer();
      }
    }

    function nextSlide() {
      if (currentIndex < coins.length - 1) {
        currentIndex++;
        syncBuffer();
      }
    }

    // Toggle between Swipe Navigation mode and Chart Interactive mode
    let isSwipeMode = true;
    function toggleMode() {
      isSwipeMode = !isSwipeMode;
      const overlay = document.getElementById('touchOverlay');
      const modeBtn = document.getElementById('modeBtn');
      if (isSwipeMode) {
        overlay.classList.remove('hidden');
        modeBtn.classList.add('active');
        modeBtn.textContent = '✋ Swipe Mode';
      } else {
        overlay.classList.add('hidden');
        modeBtn.classList.remove('active');
        modeBtn.textContent = '🔍 Chart Mode';
      }
    }

    // Touch Swipe Gesture Detection
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    function onTouchStart(e) {
      if (e.changedTouches && e.changedTouches[0]) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }

    function onTouchEnd(e) {
      if (e.changedTouches && e.changedTouches[0]) {
        touchEndX = e.changedTouches[0].screenX;
        touchEndY = e.changedTouches[0].screenY;
        handleSwipe();
      }
    }

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          nextSlide(); // swipe left -> next
        } else {
          prevSlide(); // swipe right -> prev
        }
      }
    }

    // Attach listeners to touch overlay, top bar, and bottom bar
    const touchOverlay = document.getElementById('touchOverlay');
    touchOverlay.addEventListener('touchstart', onTouchStart, { passive: true });
    touchOverlay.addEventListener('touchend', onTouchEnd, { passive: true });

    const topBar = document.getElementById('topBar');
    topBar.addEventListener('touchstart', onTouchStart, { passive: true });
    topBar.addEventListener('touchend', onTouchEnd, { passive: true });

    const bottomBar = document.getElementById('bottomBar');
    bottomBar.addEventListener('touchstart', onTouchStart, { passive: true });
    bottomBar.addEventListener('touchend', onTouchEnd, { passive: true });

    // Keyboard Arrow navigation for Desktop
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
    });

    // Initialize
    initCoins();
  </script>
</body>
</html>
